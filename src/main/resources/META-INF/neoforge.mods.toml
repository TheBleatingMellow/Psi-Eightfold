[[mods]]
modId = "psieightfold"
displayName = "Psi: Eightfold"
version = "0.1.0-alpha.1"
authors = "MellowB"
logoFile = "psieightfold.png"
logoBlur = false
credits = "Psi by Vazkii and contributors. Special thanks to jolteon my beloved."
description = '''
An independent addon for Psi focused on denser, more programmable spell construction.
Eight-way connections, diagonal routing, four-channel Cross Connectors, dynamic numbers,
conditional Tricks, entity metadata tools, base conversion, vanilla arrow launching,
and optional Pehkui scale integration.
'''

